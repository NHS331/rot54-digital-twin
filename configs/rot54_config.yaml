project:
  name: ROT-54/2.6 Digital Twin
  description: Engineering-grade computational model for solar geometry, irradiation,
    thermal maps, and thermomechanical response of the ROT-54/2.6 main reflector.
  calculation_year: 2026
site:
  name: ROT-54/2.6, Orgov / Aragats Scientific Center
  latitude_deg: 40.35
  longitude_deg: 44.28
  altitude_m: 1711.0
  timezone: Asia/Yerevan
main_reflector:
  diameter_m: 54.0
  aperture_radius_m: 27.0
  spherical_radius_m: 27.0
  effective_aperture_m: 32.0
  panel_count: 3738
  axis_tilt_south_deg: 15.0
  base_surface_rms_mm: 0.07
panel_model:
  representative_panel_area_m2: 1.21
  cell_area_m2: 0.613
  equivalent_cell_size_m: 0.783
  effective_free_span_m: 0.95
  density_kg_m3: 2700.0
  linear_thermal_expansion_1_K: 2.3e-05
  ku_central_min_mm_per_C: 0.08
  ku_central_max_mm_per_C: 0.096
  ku_upper_mm_per_C: 0.16
solar_geometry:
  use_local_time: true
  time_step_minutes: 1
  apparent_horizon_altitude_deg: -0.833
  seasonal_cases:
    spring_equinox:
      date: '2026-03-20'
      label: Spring equinox
      expected_front_duration_h: 12.03
    summer_solstice:
      date: '2026-06-22'
      label: Summer solstice
      expected_front_duration_h: 13.58
    winter_solstice:
      date: '2026-12-22'
      label: Winter solstice
      expected_front_duration_h: 9.29
irradiation:
  direct_normal_irradiance_W_m2: 850.0
  absorptivity: 0.35
  emissivity: 0.3
  atmospheric_transmittance: 0.8
  cloud_factor: 1.0
  humidity_factor: 1.0
weather_scenarios:
  air_temperature_C: 30.0
  sky_temperature_C: 15.0
  wind_speeds_m_s:
  - 0.0
  - 2.0
  - 5.0
  - 10.0
thermal_model:
  stefan_boltzmann_W_m2_K4: 5.670374419e-08
  use_transient_storage: false
  convection_h0_W_m2_K: 5.0
  convection_h1_W_m2_K_sqrt_m: 4.0
geometry_grid:
  grid_size: 301
  output_csv: outputs/geometry/main_reflector_grid.csv
  output_summary_csv: outputs/geometry/main_reflector_geometry_summary.csv
  output_figure_png: outputs/figures/main_reflector_grid.png
solar_outputs:
  seasonal_positions_csv: outputs/solar/seasonal_solar_positions.csv
  seasonal_summary_csv: outputs/solar/seasonal_solar_summary.csv
  altitude_figure_png: outputs/figures/solar_altitude_seasonal.png
  azimuth_figure_png: outputs/figures/solar_azimuth_seasonal.png
  axis_dot_figure_png: outputs/figures/solar_axis_dot_seasonal.png
incidence_model:
  output_dir: outputs/incidence
  figures_dir: outputs/figures
  representative_time_mode: max_axis_dot
  output_prefix: incidence
shadow_model:
  output_dir: outputs/shadow
  figures_dir: outputs/figures
  output_prefix: shadow
  sun_vector_local_z_epsilon: 1.0e-06
  circular_blockers:
    central_hub:
      enabled: true
      label: central_hub
      center_x_m: 0.0
      center_y_m: 0.0
      radius_m: 2.0
      z_plane_m: 0.0
    secondary_mirror:
      enabled: true
      label: secondary_mirror
      center_x_m: 0.0
      center_y_m: 0.0
      radius_m: 2.5
      z_plane_m: 4.0
    optical_reflector:
      enabled: true
      label: optical_reflector
      center_x_m: 0.0
      center_y_m: 0.0
      radius_m: 1.3
      z_plane_m: 2.0
  support_arms:
    enabled: true
    label: support_arms_internal_tripod
    angles_deg:
    - 90.0
    - 210.0
    - 330.0
    width_m: 0.7
    start_radius_m: 2.0
    end_radius_m: 15.5
    z_plane_m: 0.0
    description: Tripod legs are internal supports from the central structure to bases
      located at radius 15-16 m, not to the 27 m outer rim.
    tripod_base_radius_m: 15.5
    tripod_base_radius_allowed_range_m:
    - 15.0
    - 16.0
    outer_rim_radius_m: 27.0
    confirmed_not_outer_rim: true
    geometry_status: corrected_internal_base_radius_pending_exact_azimuths
shadow_outputs:
  summary_csv: outputs/shadow/shadow_summary.csv
  validation_csv: outputs/shadow/shadow_validation.csv
