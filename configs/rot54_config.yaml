project:
  name: "ROT-54/2.6 Digital Twin"
  description: "Engineering-grade computational model for solar geometry, irradiation, thermal maps, and thermomechanical response of the ROT-54/2.6 main reflector."
  calculation_year: 2026

site:
  name: "ROT-54/2.6, Orgov / Aragats Scientific Center"
  latitude_deg: 40.35
  longitude_deg: 44.28
  altitude_m: 1711.0
  timezone: "Asia/Yerevan"

main_reflector:
  diameter_m: 54.0
  aperture_radius_m: 27.0
  spherical_radius_m: 27.0
  effective_aperture_m: 32.0
  panel_count: 3738

  # Main axis tilt toward the south from local zenith.
  axis_tilt_south_deg: 15.0

  # Baseline passport surface smoothness.
  base_surface_rms_mm: 0.070

panel_model:
  representative_panel_area_m2: 1.21
  cell_area_m2: 0.613
  equivalent_cell_size_m: 0.783
  effective_free_span_m: 0.95
  density_kg_m3: 2700.0
  linear_thermal_expansion_1_K: 0.000023
  ku_central_min_mm_per_C: 0.080
  ku_central_max_mm_per_C: 0.096
  ku_upper_mm_per_C: 0.160

solar_geometry:
  use_local_time: true
  time_step_minutes: 1

  # Apparent solar horizon correction.
  apparent_horizon_altitude_deg: -0.833

  seasonal_cases:
    spring_equinox:
      date: "2026-03-20"
      label: "Spring equinox"
      expected_front_duration_h: 12.03

    summer_solstice:
      date: "2026-06-22"
      label: "Summer solstice"
      expected_front_duration_h: 13.58

    winter_solstice:
      date: "2026-12-22"
      label: "Winter solstice"
      expected_front_duration_h: 9.29

irradiation:
  direct_normal_irradiance_W_m2: 850.0
  absorptivity: 0.35
  emissivity: 0.30
  atmospheric_transmittance: 0.80
  cloud_factor: 1.00
  humidity_factor: 1.00

weather_scenarios:
  air_temperature_C: 30.0
  sky_temperature_C: 15.0

  wind_speeds_m_s:
    - 0.0
    - 2.0
    - 5.0
    - 10.0

thermal_model:
  stefan_boltzmann_W_m2_K4: 0.00000005670374419
  use_transient_storage: false

  # Simple first-stage convection model:
  # h(v) = h0 + h1 * sqrt(v)
  convection_h0_W_m2_K: 5.0
  convection_h1_W_m2_K_sqrt_m: 4.0

geometry_grid:
  grid_size: 301
  output_csv: "outputs/geometry/main_reflector_grid.csv"
  output_summary_csv: "outputs/geometry/main_reflector_geometry_summary.csv"
  output_figure_png: "outputs/figures/main_reflector_grid.png"

solar_outputs:
  seasonal_positions_csv: "outputs/solar/seasonal_solar_positions.csv"
  seasonal_summary_csv: "outputs/solar/seasonal_solar_summary.csv"
  altitude_figure_png: "outputs/figures/solar_altitude_seasonal.png"
  azimuth_figure_png: "outputs/figures/solar_azimuth_seasonal.png"
  axis_dot_figure_png: "outputs/figures/solar_axis_dot_seasonal.png"

incidence_model:
  output_dir: "outputs/incidence"
  figures_dir: "outputs/figures"
  representative_time_mode: "max_axis_dot"
  output_prefix: "incidence"

shadow_model:
  output_dir: "outputs/shadow"
  figures_dir: "outputs/figures"
  output_prefix: "shadow"

  # Numerical tolerance for solar vector projection.
  sun_vector_local_z_epsilon: 0.000001

  # This is a first reduced engineering shadow model.
  # The surface point is projected toward the Sun until it intersects
  # a specified obstruction reference plane z = z_plane_m.
  #
  # If the projected point falls inside an obstruction footprint,
  # then the surface point is structurally shadowed.

  circular_blockers:
    central_hub:
      enabled: true
      label: "central_hub"
      center_x_m: 0.0
      center_y_m: 0.0
      radius_m: 2.0
      z_plane_m: 0.0

    secondary_mirror:
      enabled: true
      label: "secondary_mirror"
      center_x_m: 0.0
      center_y_m: 0.0
      radius_m: 2.5
      z_plane_m: 4.0

    optical_reflector:
      enabled: true
      label: "optical_reflector"
      center_x_m: 0.0
      center_y_m: 0.0
      radius_m: 1.3
      z_plane_m: 2.0

  support_arms:
    enabled: true
    label: "support_arms"

    # Three-arm first approximation.
    # Angles are measured counterclockwise from +x in the reflector-local aperture plane.
    angles_deg:
      - 90.0
      - 210.0
      - 330.0

    width_m: 0.70
    start_radius_m: 2.0
    end_radius_m: 27.0
    z_plane_m: 0.0

shadow_outputs:
  summary_csv: "outputs/shadow/shadow_summary.csv"
  validation_csv: "outputs/shadow/shadow_validation.csv"
