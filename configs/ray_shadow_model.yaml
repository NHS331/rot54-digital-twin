ray_shadow_model:
  stage: 9
  model_name: "Numerical ray-based visibility function chi(r,t,N)"

  coordinate_system:
    origin: "main_reflector_center"
    x_axis: "east / reflector-local x"
    y_axis: "north / reflector-local y"
    z_axis: "reflector-local front-side axis"
    units: "m"

  site:
    latitude_deg: 40.35
    longitude_deg: 44.25
    altitude_m: 1711.0
    timezone_output: "Asia/Yerevan"

  reflector:
    aperture_radius_m: 27.0
    sphere_radius_m: 27.0
    southward_axis_tilt_deg: 15.0
    panel_count: 3738
    control_points_per_panel: 5

  sun_model:
    declination_model: "standard_engineering_approximation"
    hour_angle_convention: "negative morning, zero local solar noon, positive afternoon"
    selected_times:
      - key: "morning"
        active_half_angle_fraction: -0.65
      - key: "noon"
        active_half_angle_fraction: 0.0
      - key: "evening"
        active_half_angle_fraction: 0.65

  scenarios:
    equinox:
      label: "Equinox"
      day_of_year: 79
      date: "2026-03-20"
    summer_solstice:
      label: "Summer solstice"
      day_of_year: 173
      date: "2026-06-22"
    winter_solstice:
      label: "Winter solstice"
      day_of_year: 356
      date: "2026-12-22"

  obstacles:
    central_hub:
      enabled: true
      type: "vertical_cylinder"
      label: "central_hub"
      center_x_m: 0.0
      center_y_m: 0.0
      radius_m: 2.2
      z_min_m: 0.0
      z_max_m: 3.0

    secondary_mirror:
      enabled: true
      type: "vertical_cylinder"
      label: "secondary_mirror"
      center_x_m: 0.0
      center_y_m: 0.0
      radius_m: 2.5
      z_min_m: 3.0
      z_max_m: 4.8

    optical_reflector:
      enabled: true
      type: "vertical_cylinder"
      label: "optical_reflector"
      center_x_m: 0.0
      center_y_m: 0.0
      radius_m: 1.3
      z_min_m: 1.0
      z_max_m: 2.8

    tripod_legs:
      enabled: true
      type: "vertical_capsule_prisms"
      label: "tripod_legs_internal_bases"
      count: 3
      angles_deg: [270.0, 30.0, 150.0]
      start_radius_m: 2.2
      end_radius_m: 15.5
      base_radius_allowed_range_m: [15.0, 16.0]
      outer_rim_radius_m: 27.0
      width_m: 1.20
      z_min_m: 0.0
      z_max_m: 4.8
      confirmed_not_outer_rim: true

  numerical:
    ray_t_min: 0.000001
    capsule_samples_per_ray: 32
    epsilon: 0.000000001

  outputs:
    visibility_csv: "outputs/shadow_ray/control_point_visibility.csv"
    panel_summary_csv: "outputs/shadow_ray/panel_shadow_summary.csv"
    scenario_summary_csv: "outputs/shadow_ray/scenario_shadow_summary.csv"
    figures_dir: "outputs/figures/shadow_ray"



